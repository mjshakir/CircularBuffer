name: Formal Verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake ninja-build \
          clang-16 clang++-16 llvm-16-dev libclang-common-16-dev libclang-cpp16-dev \
          valgrind \
          z3 libz3-dev \
          boolector libboolector-dev \
          cvc4 libcvc4-dev \
          cvc5 libcvc5-dev \
          yices libyices-dev

    - name: Build ESBMC from source
      run: |
        git clone --depth 1 https://github.com/esbmc/esbmc.git /tmp/esbmc
        mkdir /tmp/esbmc/build && pushd /tmp/esbmc/build
        cmake .. \
          -DCMAKE_C_COMPILER=clang-16 \
          -DCMAKE_CXX_COMPILER=clang++-16 \
          -DENABLE_Z3=ON \
          -DENABLE_BOOLECTOR=ON \
          -DENABLE_CVC4=ON \
          -DENABLE_CVC5=ON \
          -DENABLE_YICES=ON \
          -DBUILD_MULTI_THREADING=ON \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -G Ninja
        ninja -j$(nproc)
        sudo ninja install
        popd

    - name: Check tool versions
      run: |
        clang++-16 --version
        ninja --version
        valgrind --version
        esbmc --version

    - name: Configure CMake (verification only)
      run: cmake -S . -B build \
        -DCMAKE_C_COMPILER=clang-16 \
        -DCMAKE_CXX_COMPILER=clang++-16 \
        -DBUILD_CIRCULARBUFFER_VERIFICATION=ON \
        -DDOWNLOAD_DEPENDENCIES=OFF \
        -DCMAKE_BUILD_TYPE=RelWithDebInfo \
        -G Ninja

    - name: Build & Run `verify` target
      run: cmake --build build --target verify -- -j$(nproc)

    - name: Upload verification logs
      uses: actions/upload-artifact@v4
      with:
        name: formal-results
        path: build/formal_results/