name: Ubuntu RISCV

on: [push, pull_request]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv]

    # GitHub has no hosted RISC-V runner: this job builds natively on x86-64 and
    # proves only that the sources build and test there, not on RISC-V.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libgtest-dev libtbb-dev cmake

    # CMake and Ninja are preinstalled on every hosted image (the runner-images
    # READMEs); lukka/get-cmake is not needed and its old cache client fails.
    - name: Show CMake version
      run: cmake --version

    - name: Check GCC Version
      run: g++ --version

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      run: cmake -S . -B build -DBUILD_CIRCULARBUFFER_MULTI_THREADING=ON -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Test with Retry
      working-directory: build
      run: |
        set +e  # Disable exit on error
        max_retries=10
        attempt=1
        while [ $attempt -le $max_retries ]; do
          echo "Test attempt $attempt"
          ctest --output-on-failure -C Release
          test_result=$?
          if [ $test_result -eq 0 ]; then
            echo "Tests passed on attempt $attempt"
            exit 0
          else
            echo "Tests failed on attempt $attempt"
          fi
          attempt=$((attempt + 1))
          sleep 1
        done
        echo "All $max_retries attempts failed"
        exit 1