name: Windows ARM

on: [push, pull_request]

env:
  BUILD_TYPE: Release
  # make sure this points to your vcpkg toolchain
  CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git vcpkg
        .\vcpkg\bootstrap-vcpkg.bat

    - name: Install libraries via vcpkg
      run: |
        .\vcpkg\vcpkg.exe install cmake:arm64-windows gtest:arm64-windows tbb:arm64-windows
        .\vcpkg\vcpkg.exe integrate install

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Verify toolchain file
      shell: pwsh
      run: |
        if (-not (Test-Path $env:CMAKE_TOOLCHAIN_FILE)) {
          Write-Error "Toolchain file not found: $env:CMAKE_TOOLCHAIN_FILE"
          exit 1
        }
        Write-Host "Using toolchain: $env:CMAKE_TOOLCHAIN_FILE"

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S . -B build `
          -G "Visual Studio 17 2022" `
          -A ARM64 `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_TOOLCHAIN_FILE=${{ env.CMAKE_TOOLCHAIN_FILE }}

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --verbose

    - name: Test with Retry
      shell: pwsh
      working-directory: build
      run: |
        $max=10; $i=1
        while ($i -le $max) {
          Write-Host "Test attempt $i"
          ctest -C ${{ env.BUILD_TYPE }} --output-on-failure
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $i++; Start-Sleep 1
        }
        Write-Host "All $max attempts failed"
        exit 1