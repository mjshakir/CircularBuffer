name: Windows ARM

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm]

    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git vcpkg
        .\vcpkg\bootstrap-vcpkg.bat

    - name: Install libraries via vcpkg
      run: |
        .\vcpkg\vcpkg.exe install gtest:arm64-windows tbb:arm64-windows
        .\vcpkg\vcpkg.exe integrate install

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      run: |
        cmake -S . -B build `
          -G "Visual Studio 17 2022" `
          -A ARM64 `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_TOOLCHAIN_FILE=${{ env.CMAKE_TOOLCHAIN_FILE }}

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --verbose

    - name: Test with Retry
      shell: pwsh
      run: |
        $max_retries = 10
        $attempt = 1
        while ($attempt -le $max_retries) {
          Write-Output "Test attempt $attempt"
          ctest --output-on-failure -C Release
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Tests passed on attempt $attempt"
            exit 0
          } else {
            Write-Output "Tests failed on attempt $attempt"
          }
          $attempt++
          Start-Sleep -Seconds 1
        }
        Write-Output "All $max_retries attempts failed"
        exit 1
      working-directory: build