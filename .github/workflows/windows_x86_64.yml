name: Windows x86_64

on: [push, pull_request]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
        & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
        echo "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "CMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    
    - name: Install GTest
      run: |
        & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" search gtest
        & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install gtest:x64-windows
        & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" integrate install
    
    - name: Install TBB
      run: |
        & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" search tbb
        & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install tbb:x64-windows
        & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" integrate install

    - name: Update vcpkg
      run: |
        & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" update
        & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" upgrade --no-dry-run

    # CMake and Ninja are preinstalled on every hosted image (the runner-images
    # READMEs); lukka/get-cmake is not needed and its old cache client fails.
    - name: Show CMake version
      run: cmake --version

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Check MSVC Version
      run: |
        try {
          $versionOutput = cl 2>&1
          $match = $versionOutput | Select-String -Pattern "Version (\d+\.\d+)"
          if ($match) {
              $version = [Version]$match.Matches.Groups[1].Value
              Write-Output "MSVC version found: $version"
              if ($version -lt [Version]"19.28") {
                  throw "MSVC version is less than 19.28"
              }
          } else {
              Write-Output "MSVC version could not be determined. Skipping version check."
              echo "skip_step=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
        } catch {
          throw $_
        }
      shell: pwsh
      id: check_msvc

    - name: Create build directory
      if: steps.check_msvc.outputs.skip_step != 'true'
      run: mkdir build

    - name: Verify vcpkg Installation
      run: ${{ runner.temp }}\vcpkg\vcpkg.exe list

    - name: Configure CMake
      run: |
        echo "CMAKE_TOOLCHAIN_FILE is: $env:CMAKE_TOOLCHAIN_FILE"
        cmake -S . -B build -DBUILD_CIRCULARBUFFER_MULTI_THREADING=OFF -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --verbose

    - name: List build and lib directory contents
      run: |
        if (Test-Path build) { Get-ChildItem -Recurse build } else { Write-Output 'build does not exist' }
        if (Test-Path build/lib) { Get-ChildItem -Recurse build/lib } else { Write-Output 'build/lib does not exist' }

    - name: Test with Retry
      shell: pwsh
      run: |
        $max_retries = 10
        $attempt = 1
        while ($attempt -le $max_retries) {
          Write-Output "Test attempt $attempt"
          ctest --output-on-failure -C ${{ env.BUILD_TYPE }}
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Tests passed on attempt $attempt"
            exit 0
          } else {
            Write-Output "Tests failed on attempt $attempt"
          }
          $attempt++
          Start-Sleep -Seconds 1
        }
        Write-Output "All $max_retries attempts failed"
        exit 1
      working-directory: build

    - name: Diagnostics if build fails
      if: failure()
      run: |
        echo "Build failed. Listing build directory contents:"
        if (Test-Path build) { Get-ChildItem -Recurse build } else { Write-Output 'build does not exist' }
        if (Test-Path .\lib\Release) { Get-ChildItem -Path .\lib\Release -Recurse -Name }
      shell: pwsh