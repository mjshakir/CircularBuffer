name: macOS x86_64

on: [push, pull_request]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        arch: [x86]

    runs-on: macos-15-intel

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Homebrew
      run: |
        which brew
        if [ $? -ne 0 ]; then
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        fi

    - name: Install Google Test
      run: brew install googletest

    - name: Install cmake and tbb
      run: brew install cmake tbb

    # CMake and Ninja are preinstalled on every hosted image (the runner-images
    # READMEs); lukka/get-cmake is not needed and its old cache client fails.
    - name: Show CMake version
      run: cmake --version

    - name: Check Clang Version
      run: clang++ --version

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Test with Retry
      working-directory: build
      run: |
        set +e  # Disable exit on error
        max_retries=10
        attempt=1
        while [ $attempt -le $max_retries ]; do
          echo "Test attempt $attempt"
          ctest --output-on-failure -C Release
          test_result=$?
          if [ $test_result -eq 0 ]; then
            echo "Tests passed on attempt $attempt"
            exit 0
          else
            echo "Tests failed on attempt $attempt"
          fi
          attempt=$((attempt + 1))
          sleep 1
        done
        echo "All $max_retries attempts failed"
        exit 1

    - name: Run Fixed Benchmarks
      run: ./build/benchmarkbin/CircularBuffer_Fixed_Benchmark | tee fixed_benchmark_results.txt
  
    - name: Run Dynamic Benchmarks
      run: ./build/benchmarkbin/CircularBuffer_Dynamic_Benchmark | tee dynamic_benchmark_results.txt

    - name: Display Fixed Benchmark results
      run: cat fixed_benchmark_results.txt

    - name: Display Dynamic Benchmark results
      run: cat dynamic_benchmark_results.txt